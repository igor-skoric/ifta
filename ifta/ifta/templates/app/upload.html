{% extends "base.html" %}

{% block title %}Upload · IFTA{% endblock %}

{% load static %}

{% block content %}

<div class="w-full px-4 py-8 sm:px-6 sm:py-12 lg:px-8">

  <div class="mx-auto w-full max-w-3xl rounded-2xl border border-white/10 bg-white/[0.04] p-6 shadow-2xl shadow-black/30 backdrop-blur-sm sm:p-8">
    <p class="text-center text-xs font-semibold uppercase tracking-widest text-indigo-300/90">Import</p>
    <h1 class="mt-1 text-center text-2xl font-bold tracking-tight text-white">Upload IFTA</h1>
    <p class="mt-2 text-center text-sm text-slate-400">Miles and fuel Excel files</p>

    {% if error %}
    <div class="mt-4 rounded-xl border border-amber-500/30 bg-amber-500/10 px-4 py-3 text-sm text-amber-100" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="mt-6 flex flex-col gap-5">
      {% csrf_token %}

      <label class="block text-sm font-medium text-slate-300">
        IFTA miles (Excel)
        <input type="file" name="single_file" multiple
               class="mt-2 w-full rounded-xl border border-white/10 bg-slate-950/40 px-3 py-2 text-sm text-slate-200 file:mr-3 file:rounded-lg file:border-0 file:bg-indigo-500/80 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-white hover:file:bg-indigo-400">
      </label>

      <label class="block text-sm font-medium text-slate-300">
        Fuel (Excel, multiple)
        <input type="file" name="multiple_files" multiple
               class="mt-2 w-full rounded-xl border border-white/10 bg-slate-950/40 px-3 py-2 text-sm text-slate-200 file:mr-3 file:rounded-lg file:border-0 file:bg-emerald-500/80 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-white hover:file:bg-emerald-400">
      </label>

      <label class="block text-sm font-medium text-slate-300">
        Year
        <select name="year"
                class="mt-2 w-full rounded-xl border border-white/10 bg-slate-950/50 px-4 py-2.5 text-sm text-slate-100 focus:border-indigo-400/50 focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
          {% for value, label in form.year.field.choices %}
          <option value="{{ value }}" {% if form.year.value == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>

      <label class="block text-sm font-medium text-slate-300">
        Quarter
        <select name="quarter"
                class="mt-2 w-full rounded-xl border border-white/10 bg-slate-950/50 px-4 py-2.5 text-sm text-slate-100 focus:border-indigo-400/50 focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
          {% for value, label in form.quarter.field.choices %}
          <option value="{{ value }}" {% if form.quarter.value == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>

      <button type="submit"
              class="rounded-xl bg-indigo-500 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/25 transition hover:bg-indigo-400">
        Upload
      </button>
    </form>

    <p class="mt-6 text-center">
      <a href="{% url 'ifta:report' %}" class="text-sm font-medium text-indigo-300 transition hover:text-indigo-200">
        View IFTA pivot report →
      </a>
    </p>
  </div>
</div>

{% endblock %}
