{% extends "base.html" %}

{% block title %}Role management{% endblock %}

{% block content %}
<div class="w-full px-4 py-6 sm:px-6 lg:px-8">
  <div class="mb-6 flex items-end justify-between">
    <div>
      <p class="text-xs font-semibold uppercase tracking-widest text-indigo-300/90">Accounts</p>
      <h1 class="text-2xl font-bold tracking-tight text-white sm:text-3xl">Roles</h1>
    </div>
    <a href="{% url 'accounts:admin_roles_create' %}" class="rounded-xl bg-indigo-500 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-400">+ New role</a>
  </div>

  <div class="grid grid-cols-1 gap-4">
    {% for role in roles %}
    <article class="rounded-2xl border border-white/10 bg-white/[0.03] p-4">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h3 class="text-lg font-semibold text-white">{{ role.name }}</h3>
          <p class="text-sm text-slate-300">{{ role.description|default:"No description" }}</p>
          <div class="mt-2 text-xs text-slate-400">Slug: {{ role.slug }}</div>
        </div>
        <a href="{% url 'accounts:admin_roles_edit' role.pk %}" class="rounded-lg border border-white/20 px-3 py-1.5 text-xs text-slate-200 hover:bg-white/10">Edit</a>
      </div>
    </article>
    {% empty %}
    <p class="text-slate-400">No roles defined.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
