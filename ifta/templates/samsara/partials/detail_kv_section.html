{% if rows %}
<section class="rounded-2xl border border-white/10 bg-white/[0.03] p-4">
  <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">{{ section_title }}</h2>
  <div class="mt-3 overflow-x-auto rounded-xl border border-white/10">
    <table class="min-w-full text-sm">
      <tbody class="divide-y divide-white/10">
        {% for label, value in rows %}
        <tr class="hover:bg-white/[0.03]">
          <th class="w-2/5 whitespace-nowrap px-4 py-2.5 text-left font-medium text-slate-500">{{ label }}</th>
          <td class="px-4 py-2.5 text-slate-200">{{ value }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endif %}
