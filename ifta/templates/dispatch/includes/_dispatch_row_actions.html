<td class="dispatch-list-actions-cell w-12 px-2 py-3 text-right">
  <div class="dispatch-row-actions relative inline-block text-left" data-dispatch-row-actions>
    <button type="button"
      class="dispatch-row-actions__trigger inline-flex h-8 w-8 items-center justify-center rounded-lg border border-transparent text-slate-400 transition hover:border-white/10 hover:bg-white/[0.06] hover:text-slate-200"
      aria-label="Row actions"
      aria-expanded="false"
      aria-haspopup="true">
      <i class="fa-solid fa-ellipsis-vertical text-sm" aria-hidden="true"></i>
    </button>
    <div class="dispatch-row-actions__menu hidden absolute right-0 z-30 mt-1 min-w-[9rem] overflow-hidden rounded-xl border border-white/10 bg-slate-900 py-1 shadow-xl shadow-black/40" role="menu">
      <a href="{{ edit_url }}" role="menuitem"
        class="block px-3 py-2 text-sm font-semibold text-slate-200 hover:bg-white/10 hover:text-white"
        {% if use_entity_modal %}data-dispatch-entity-modal{% endif %}>Edit</a>
    </div>
  </div>
</td>
