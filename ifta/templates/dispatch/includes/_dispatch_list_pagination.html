{% if page_obj.paginator.num_pages > 1 %}
<div class="dispatch-list-pagination flex flex-wrap items-center justify-between gap-3 border-t border-white/10 px-4 py-3 text-sm text-slate-400">
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  <div class="flex gap-2">
    {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}{% if filter_querystring %}&amp;{{ filter_querystring }}{% endif %}"
       class="rounded-lg border border-white/15 px-3 py-1.5 font-semibold text-slate-200 hover:bg-white/10">Previous</a>
    {% endif %}
    {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}{% if filter_querystring %}&amp;{{ filter_querystring }}{% endif %}"
       class="rounded-lg border border-white/15 px-3 py-1.5 font-semibold text-slate-200 hover:bg-white/10">Next</a>
    {% endif %}
  </div>
</div>
{% endif %}
