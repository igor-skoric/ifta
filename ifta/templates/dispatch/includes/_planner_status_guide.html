<details class="app-topbar-dropdown app-status-guide planner-toolbar__status">
  <summary class="app-btn app-btn--ghost app-btn--sm app-status-guide__trigger" aria-label="Status guide">
    <i class="fa-solid fa-circle-half-stroke text-[11px] opacity-80" aria-hidden="true"></i>
    <span>Status guide</span>
    <i class="fa-solid fa-chevron-down text-[9px] opacity-60" aria-hidden="true"></i>
  </summary>
  <div class="app-topbar-dropdown__panel app-status-guide__panel">
    <p class="app-status-guide__heading">Status guide</p>
    <div class="app-status-guide__grid">
      {% for value, label in load_status_choices %}
      <span class="planner-status-legend__chip trip-status-badge--{{ value }}">{{ label }}</span>
      {% endfor %}
    </div>
    <div class="app-status-guide__driver">
      <span class="text-[10px] font-semibold uppercase tracking-wider load-detail-subtle">Driver</span>
      <span class="dispatch-unavailable-legend rounded-md border px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider">Off / unavailable</span>
    </div>
  </div>
</details>
