{# icon: truck | trailer | driver #}
<div class="flex items-start gap-3 rounded-xl border border-white/10 bg-slate-950/40 p-3">
  <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-indigo-500/15 text-indigo-300">
    {% if icon == "truck" %}
    <i class="fa-solid fa-truck text-sm" aria-hidden="true"></i>
    {% elif icon == "trailer" %}
    <i class="fa-solid fa-trailer text-sm" aria-hidden="true"></i>
    {% else %}
    <i class="fa-solid fa-user text-sm" aria-hidden="true"></i>
    {% endif %}
  </div>
  <div class="min-w-0 flex-1">
    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">{{ label }}</p>
    {% if detail_url %}
    <a href="{{ detail_url }}" class="mt-0.5 block font-mono text-sm font-semibold text-indigo-300 hover:text-indigo-200 hover:underline">{{ unit_label }}</a>
    {% elif unit_label %}
    <p class="mt-0.5 font-mono text-sm font-semibold text-slate-200">{{ unit_label }}</p>
    {% else %}
    <p class="mt-0.5 text-sm text-slate-600">Not assigned</p>
    {% endif %}
    {% if subtext %}<p class="mt-0.5 text-xs text-slate-500">{{ subtext }}</p>{% endif %}
  </div>
</div>
