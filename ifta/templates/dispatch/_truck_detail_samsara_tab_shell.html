<div
  id="detail-tab-panel-samsara"
  data-tab-panel="samsara"
  class="mt-6 hidden"
  role="tabpanel"
  aria-labelledby="detail-tab-samsara"
  hidden
  data-samsara-panel-url="{{ samsara_panel_url }}"
>
  <div data-samsara-panel-loader class="app-module-panel flex min-h-[14rem] flex-col items-center justify-center gap-3 rounded-2xl px-6 py-12">
    <div class="h-9 w-9 animate-spin rounded-full border-2 border-indigo-400/30 border-t-indigo-400" aria-hidden="true"></div>
    <p class="text-sm font-medium text-slate-300">Loading Samsara data…</p>
    <p class="text-xs text-slate-500">Live GPS, fuel, engine and faults from Samsara API</p>
  </div>
  <div data-samsara-panel-error class="app-alert-error hidden rounded-2xl px-4 py-6 text-center text-sm"></div>
  <div data-samsara-panel-content class="hidden"></div>
</div>
