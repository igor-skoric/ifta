{% extends "base.html" %}

{% block title %}{% if is_edit %}Edit Employee{% else %}Add Employee{% endif %} · Office{% endblock %}

{% block content %}
<div class="w-full px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-3xl rounded-2xl border border-white/10 bg-white/[0.04] p-6 shadow-xl">
    <div class="mb-4 flex items-center justify-between">
      <h1 class="text-xl font-bold text-white">{% if is_edit %}Edit employee{% else %}Add new employee{% endif %}</h1>
      <a href="{% url 'office:people_list' %}" class="text-sm text-slate-300 hover:text-white">Back to list</a>
    </div>
    <form method="post" class="space-y-3">
      {% csrf_token %}
      {% for field in form %}
        <label class="block text-sm text-slate-300">
          <span class="mb-1 block">{{ field.label }}</span>
          {{ field }}
        </label>
      {% endfor %}
      <button type="submit" class="rounded-xl bg-indigo-500 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-400">
        Save
      </button>
    </form>
  </div>
</div>
{% endblock %}
